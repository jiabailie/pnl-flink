services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: pnl-flink-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: pnl-flink-redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: pnl-flink-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pnl
      POSTGRES_USER: pnl
      POSTGRES_PASSWORD: pnl
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnl -d pnl"]
      interval: 10s
      timeout: 5s
      retries: 10

  jobmanager:
    image: flink:1.18.1-java17
    container_name: pnl-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pnl
      POSTGRES_USER: pnl
      POSTGRES_PASSWORD: pnl
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./pnl-calculator/target/pnl-calculator-1.0-SNAPSHOT.jar:/opt/flink/usrlib/pnl-calculator.jar

  taskmanager:
    image: flink:1.18.1-java17
    container_name: pnl-flink-taskmanager
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4

  transaction-generator:
    image: eclipse-temurin:17-jre
    container_name: pnl-flink-transaction-generator
    profiles: ["apps"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      GENERATOR_ACCOUNT_COUNT: 5
      GENERATOR_SYMBOLS: AAPL,MSFT,GOOG,TSLA,NVDA
      GENERATOR_INTERVAL_MS: 1000
    working_dir: /app
    command: ["java", "-jar", "/app/transaction-generator.jar"]
    volumes:
      - ./transaction-generator/target/transaction-generator-1.0-SNAPSHOT.jar:/app/transaction-generator.jar

  dashboard:
    image: eclipse-temurin:17-jre
    container_name: pnl-flink-dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/pnl
      POSTGRES_USER: pnl
      POSTGRES_PASSWORD: pnl
    working_dir: /app
    command: ["java", "-jar", "/app/dashboard.jar"]
    ports:
      - "8088:8088"
    volumes:
      - ./dashboard/target/dashboard-1.0-SNAPSHOT.jar:/app/dashboard.jar

volumes:
  postgres-data:
